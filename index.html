
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niginigichat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f3f5f7;
      color: #20252b;
    }

    .app {
      max-width: 720px;
      height: 100dvh;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #247b59;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    #status {
      font-size: 12px;
      margin-top: 5px;
      opacity: .9;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      align-self: flex-start;
      background: #edf0f2;
      padding: 10px 13px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .message.mine {
      align-self: flex-end;
      background: #d7f8df;
    }

    .nickname {
      font-size: 12px;
      font-weight: 700;
      color: #47715c;
      margin-bottom: 4px;
    }

    .content {
      white-space: pre-wrap;
    }

    .time {
      color: #6b737b;
      font-size: 10px;
      margin-top: 5px;
      text-align: right;
    }

    #composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e6e8eb;
    }

    input, button {
      font: inherit;
      border-radius: 10px;
      padding: 11px;
    }

    #text {
      flex: 1;
      min-width: 0;
      border: 1px solid #ccd2d8;
    }

    button {
      border: 0;
      background: #247b59;
      color: white;
      cursor: pointer;
    }

    button:disabled, input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #notice {
      padding: 8px 12px;
      color: #9b3026;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>niginigichat 💬</h1>
      <div id="status">接続しています...</div>
    </header>

    <div id="messages" aria-live="polite"></div>
    <div id="notice" role="status"></div>

    <form id="composer">
      <input
        id="text"
        maxlength="2000"
        placeholder="メッセージを入力..."
        autocomplete="off"
        disabled
        required
      >
      <button id="send" type="submit" disabled>送信</button>
    </form>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // STEP 5で取得した値に置き換える
    const SUPABASE_URL = "https://krrsjlwjlnhsjfclqxgn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7gL_vzRXQRZBUcoHQAEDTQ_w5XZrMkH";

    const ROOM_ID = "general";

    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const noticeEl = document.getElementById("notice");
    const form = document.getElementById("composer");
    const textInput = document.getElementById("text");
    const sendButton = document.getElementById("send");

    let supabase;
    let currentUser;
    let nickname;
    let sending = false;

    // HTMLとして解釈させず、文字列として表示する
    function addMessage(message) {
      // 同じメッセージが履歴とRealtimeの両方から
      // 届いた場合の重複を防ぐ
      if (document.getElementById("message-" + message.id)) {
        return;
      }

      const item = document.createElement("article");
      item.className = "message";
      item.id = "message-" + message.id;

      if (message.user_id === currentUser.id) {
        item.classList.add("mine");
      }

      const name = document.createElement("div");
      name.className = "nickname";
      name.textContent = message.nickname;

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = message.content;

      const time = document.createElement("div");
      time.className = "time";

      const date = new Date(message.created_at);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleTimeString("ja-JP", {
            hour: "2-digit",
            minute: "2-digit"
          });

      item.append(name, content, time);
      messagesEl.appendChild(item);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showError(message) {
      noticeEl.textContent = message;
    }

    async function startChat() {
      if (
        SUPABASE_URL.includes("YOUR_SUPABASE") ||
        SUPABASE_KEY.includes("YOUR_SUPABASE")
      ) {
        throw new Error("HTMLのSupabase設定値を置き換えてください。");
      }

      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      // 前回の匿名セッションがあれば再利用。
      // なければ自動で匿名ユーザーを作成する。
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError) throw sessionError;

      if (sessionData.session) {
        currentUser = sessionData.session.user;
      } else {
        const { data, error } =
          await supabase.auth.signInAnonymously();

        if (error) throw error;
        currentUser = data.user;
      }

      // 初回のみ名前を聞く。ログイン画面ではない。
      nickname = localStorage.getItem("niginigi_nickname");

      if (!nickname) {
        nickname = prompt("チャットで使うニックネームを入力してください")?.trim();
      }

      if (!nickname) nickname = "ゲスト";

      nickname = Array.from(nickname).slice(0, 30).join("");
      localStorage.setItem("niginigi_nickname", nickname);

      statusEl.textContent = "接続中：" + nickname;

      // 過去のメッセージを読み込む
      const { data: history, error: historyError } =
        await supabase
          .from("messages")
          .select("*")
          .eq("room_id", ROOM_ID)
          .order("created_at", { ascending: false })
          .limit(50);

      if (historyError) throw historyError;

      history.reverse().forEach(addMessage);

      // 新しいメッセージをリアルタイムで受信
      supabase
        .channel("chat-" + ROOM_ID)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: "room_id=eq." + ROOM_ID
          },
          (payload) => addMessage(payload.new)
        )
        .subscribe((state) => {
          if (state === "SUBSCRIBED") {
            statusEl.textContent = "オンライン：" + nickname;
            textInput.disabled = false;
            sendButton.disabled = false;
            textInput.focus();
          } else if (state === "CHANNEL_ERROR" ||
                     state === "TIMED_OUT") {
            statusEl.textContent = "接続エラー。再接続を確認中...";
          }
        });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (sending || !currentUser || !supabase) return;

      const content = textInput.value.trim();
      if (!content) return;

      sending = true;
      sendButton.disabled = true;
      noticeEl.textContent = "";

      try {
        const { error } = await supabase
          .from("messages")
          .insert({
            room_id: ROOM_ID,
            user_id: currentUser.id,
            nickname,
            content
          });

        if (error) throw error;

        textInput.value = "";
        textInput.focus();
      } catch (error) {
        console.error(error);
        showError("送信できませんでした。設定と接続を確認してください。");
      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    });

    startChat().catch((error) => {
      console.error(error);
      statusEl.textContent = "接続できませんでした";
      showError(error.message || "設定を確認してください。");
    });
  </script>
</body>
</html>
